name = "stock-research-worker"
main = "worker.js"
compatibility_date = "2024-09-01"

[[kv_namespaces]]
binding = "REC_LOG"
id = "6e2feae8a08c4db0b564e5bce18d2b01"

# KV keys used:
#   yahoo:crumb         — Yahoo session crumb (50-min TTL)
#   daily:snapshot      — 6am Claude synthesis (headline, newsCards, opportunity, avoid)
#   daily:midday        — 11:30am PT midday pulse (narrative, topics, tomorrow, trades, bigMovers)
#   daily:eod           — 1:15pm PT end-of-day summary (headline, body)
#   analysis:{TICKER}   — per-ticker Claude analysis (trend, pattern, action, summary)
#   fund:{TICKER}       — per-ticker Yahoo fundamentals cache (6h TTL)
#   market:ipos         — IPO calendar cache (12h TTL)
#   market:goldencross  — golden-cross setups (1h TTL)
#   scanner:{preset}    — day-trading scanner results (90s TTL)
#   watchlist:tickers   — saved watchlist; also seeds scan universes
#   rec:{TICKER}        — recommendation history

[triggers]
# Single cron (plan limit: 5 triggers max). Fires every 15 min in a UTC window
# covering all three PT jobs in both DST regimes; scheduled() dispatches by
# Pacific wall-clock time:
#   Morning briefing — 6:00am PT   (13:00 UTC PDT / 14:00 UTC PST)
#   Midday pulse     — 11:30am PT  (18:30 UTC PDT / 19:30 UTC PST)
#   EOD summary      — 1:15pm PT   (20:15 UTC PDT / 21:15 UTC PST)
# Each job deduplicates via KV timestamp check (2-hour window).
crons = ["*/15 13-22 * * 1-5"]

# Required secrets (set via: npx wrangler secret put <NAME>):
#   ANTHROPIC_API_KEY  — Anthropic API key
#   ALPACA_KEY         — Alpaca API key ID (optional, improves price + news quality)
#   ALPACA_SECRET      — Alpaca API secret key
