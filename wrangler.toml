name = "stock-research-worker"
main = "worker.js"
compatibility_date = "2024-09-01"

# ── Observability ────────────────────────────────────────────────────────────
# Mirrors what was set in the Cloudflare dashboard. It has to live here, because
# `wrangler deploy` sends the whole config and OVERWRITES dashboard-set values —
# the same drift that produced the cron-trigger divergence warning. Wrangler
# knows this: normalizeRemoteConfigAsResolvedLocal() in its own source skips
# observability when comparing local to remote, commenting that it "has a remote
# default behavior different from that of wrangler". So a dashboard-only setting
# survives exactly until the next deploy.
#
# WITHOUT THIS BLOCK THERE IS NO CRON EXECUTION HISTORY. `wrangler tail` streams
# live events only; with logs off, a quiet tail means nothing at all — it cannot
# distinguish "the cron did not fire" from "the cron fired and nothing was
# retained". That ambiguity cost two hours of the day this was found.
#
# The top-level `enabled` is load-bearing and is NOT redundant with logs.enabled.
# wrangler's normalizeObservability() computes
#   const enabled = obs?.enabled === true ? true : false
# and uses THAT as the default for logs.enabled. Omitting it here would deploy
# `observability.enabled: false` next to `logs.enabled: true`.
#
# Key names verified against node_modules/wrangler/config-schema.json for the
# pinned wrangler (4.118.0) rather than hand-translated from the docs — the
# published TOML example omits the nested logs/traces tables entirely.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true          # keep the per-invocation summary lines
persist = true                  # retain in the dashboard's queryable log store

# Explicitly off rather than omitted: an absent value is whatever the dashboard
# last said, which is the drift this block exists to close.
[observability.traces]
enabled = false

[[kv_namespaces]]
binding = "REC_LOG"
id = "6e2feae8a08c4db0b564e5bce18d2b01"

# KV keys used:
#   yahoo:crumb         — Yahoo session crumb + cookie. 2d retention
#                         (CRUMB_KV_TTL), and NO FRESHNESS TERM AT ALL: a banked
#                         crumb is reused WHATEVER ITS AGE, in memory and in KV.
#                         WAS 1h (with a 50-min in-memory TTL) UNTIL 2026-09-02.
#                         The last writer of a trading day is the 1:15pm PT sweep,
#                         so at 1h the 7:00am PT morning-rows sweep could NEVER
#                         reuse a crumb — the newest one possible had been dead
#                         ~16h — and had to acquire cold at 10:00am ET, the peak
#                         of Yahoo's anti-bot pressure. On 2026-09-02 that failed
#                         and all 40 tickers banked `status: 'error'` rows twice.
#                         The 1:15pm sweep runs the same code and never sees it,
#                         because it acquires post-close. Reusing any age is safe
#                         because yahooAuth and both screener callers RE-ACQUIRE
#                         on a 401/403, so a stale crumb self-corrects on first
#                         use; a MISSING crumb has no recovery at all.
#   daily:snapshot      — 6am Claude synthesis (headline, newsCards, opportunity, avoid)
#   daily:midday        — 11:30am PT midday pulse (narrative, topics, tomorrow, trades, bigMovers)
#   daily:eod           — 1:15pm PT end-of-day summary (headline, body)
#   analysis:{TICKER}   — per-ticker Claude analysis (trend, pattern, action, summary)
#   iv:{TICKER}:{DATE}  — daily ATM IV sample feeding ivRank (400d TTL, value + KV metadata)
#   cik:map             — SEC ticker->CIK map (30d TTL)
#   insider:{TICKER}    — parsed SEC Form 4 report (12h TTL)
#   short:{TICKER}      — FINRA short interest (6h TTL)
#   13f:index           — ticker->managers 13F reverse index (rebuilt weekly)
#   finra:token         — FINRA OAuth2 bearer token
#   econ:fred           — FRED release dates (12h TTL)
#   ivsweep:last        — PT date of last cron IV sweep (dedup)
#   (NO fund:{TICKER} KEY EXISTS. This line used to claim a "per-ticker Yahoo
#    fundamentals cache (6h TTL)" and there is no such key — verified 2026-08-19
#    by grepping worker.js for the literal: zero readers, zero writers, and the
#    string `fund:` appears exactly once, as the TTL table entry below. The
#    fundamentals a ticker page reads come straight from /api/quote's Yahoo
#    quoteSummary call and are not banked in KV at all. `TTL.fund` (6h) survives
#    as a LABEL ONLY: handlePeers() stamps it as `ttlSeconds` on the _meta of an
#    UNCACHED response, so it tells the badge how stale to consider a figure
#    rather than how long anything is kept. A key listed here that does not exist
#    is worse than an omission — it reads as a cache someone can go and inspect.)
#   premium:{TICKER}    — the shared IV/earnings header, cached on demand
#                         (4h fresh, 24h retained). DELIBERATELY NOT RAISED
#                         alongside long: on 2026-08-31: refreshLongTicker gates
#                         the warm path on PREMIUM_FRESH_MS (4h) and reuses a
#                         FRESH header only, so a longer retention here would
#                         never be read by anything.
#   long:{TICKER}       — long-screen row (4h fresh, 7d retained). Written on
#                         demand by /api/long/:ticker AND by both cron sweeps
#                         (7:00am PT collectMorningRows, 1:15pm PT collectTop3).
#                         RETENTION WENT 24h -> 7d ON 2026-08-31. At 24h a Friday
#                         1:15pm write was evicted on the Saturday and no cron
#                         runs at a weekend, so the entire Options surface read
#                         "not loaded" from Saturday afternoon until Monday
#                         1:15pm. The binding case is a Thursday 1:15pm write
#                         read on the Tuesday after a Friday+Monday closure —
#                         ~115h ≈ 4.8d — plus headroom for one missed cron. Same
#                         figure and same class of gap as TOP3_TTL and MOVES_TTL.
#                         FRESHNESS IS UNCHANGED at LONG_FRESH_MS (4h): this is
#                         retention only, and nothing that ranks or scores can
#                         reach an older row — top3Sweep reuses only inside 4h
#                         and only a non-`error` row, top3Rank drops any row
#                         whose own PT date is not today, and readLongRow retires
#                         any row whose schema is not LONG_SCHEMA.
#   longarch:{TICKER}:{PT-DATE}:{SLOT}
#                       — THE SWEEP ARCHIVE. One banked snapshot of a swept long
#                         row, verbatim. slot = `open` (7:00am PT sweep) or `eod`
#                         (1:15pm PT sweep). 7d retention (LONGARCH_TTL), matching
#                         long:. Added 2026-08-31: long:{TICKER} is overwritten in
#                         place, so every computation DESTROYED the evidence of
#                         the last one — Friday's GOOGL row carried a Lane B Oct
#                         360 call at E[R] 165% and Monday's recompute put the
#                         same expiry at 14-19%, undiagnosably, because the Friday
#                         row was gone.
#                         OWN PREFIX, DELIBERATELY NOT long:{TICKER}:{DATE}.
#                         `longarch:` and `long:` are DISJOINT string prefixes —
#                         after `long` comes `a`, not `:` — so a
#                         list({prefix:'long:'}) can never read an archive record
#                         as a ticker. Same rule as ivsweep:last outside iv: and
#                         incomerow: not being income:.
#                         CRON SWEEPS ONLY, never an on-demand /api/long/:ticker
#                         refresh: a fixed-clock write is a daily series, an
#                         on-demand write is a record of what someone opened, and
#                         only the former makes a Monday-vs-Friday diff
#                         like-for-like (the recordIvSample principle).
#                         REUSED ROWS ARE ARCHIVED TOO. The SLOT names when the
#                         SNAPSHOT was taken; the row's own `ts` names when its
#                         DATA was computed, which for a row reused inside
#                         LONG_FRESH_MS is an earlier moment. Neither is rewritten
#                         to agree with the other. A retry firing overwrites the
#                         same slot — newest per slot wins.
#                         Read by GET /api/long/:ticker?date=&slot= and nothing
#                         else; served verbatim, never recomputed or backfilled,
#                         and it only ever runs FORWARD from its first deploy.
#   morningrows:last    — PT date of the last COMPLETE 7:00am PT long-row sweep
#                         (dedup). OUTSIDE any scanned prefix, same rule as
#                         ivsweep:last / movesweep:last / macrosweep:last /
#                         moodsweep:last / top3sweep:last. 2d TTL
#                         (MORNING_ROWS_STAMP_TTL), matching the siblings.
#                         Stamped only when ZERO tickers hit an INFRASTRUCTURE
#                         failure; a name with nothing screenable (no-options /
#                         no-iv / no-expiries) is a complete outcome and does not
#                         block it. THIS KEY IS NOT top3sweep:last AND MUST NEVER
#                         BE: the 7am job populates rows and RANKS NOTHING, so it
#                         must not be able to dedup the 1:15pm ranking out of the
#                         day.
#   moves:{TICKER}      — historical N-session return distribution behind the Long
#                         tab's measured `cov` column and its expectancy ranking.
#                         Banked by the 2:00pm PT sweep, 7d TTL, ~60 KB/ticker.
#                         Sorted [return, startIdx] PAIRS — schema 2; the reader
#                         treats any other schema as ABSENT and recomputes.
#   calib:pooled        — pooled recommendation calibration across every rec: key.
#                         The basis used when a ticker has fewer than
#                         REC_CALIB_MIN_N resolved outcomes of its own. No TTL;
#                         rewritten daily by fillForwardReturns(), which already
#                         performs the rec: scan it needs.
#   movesweep:last      — PT date of the last move-series sweep (dedup). Outside
#                         the `moves:` prefix so nothing scanning that prefix
#                         picks it up as a ticker.
#   macro:state         — classified macro regime (constructive / mixed / hostile /
#                         unavailable) plus the four raw inputs, both term spreads
#                         and the gates. ~727 B, MACRO_SCHEMA 1. Read on EVERY
#                         long-screen request, so it is deliberately small.
#                         90d retained / MACRO_FRESH_MS (26h) fresh — the long
#                         retention is the outage path, same reasoning as
#                         econ:dgs3mo: a labelled old macro read beats a blank
#                         chip, and the card renders its own age.
#   macro:series        — 756-session (~3y) slice of DERIVED per-session inputs,
#                         computed over the full 10y pull then sliced so the
#                         SMA200 is valid from its first session. ~31 KB,
#                         MACRO_SCHEMA 1, bumped together with macro:state.
#                         READ BY NOTHING IN PHASE 1 — it exists so phase 2's
#                         regime-conditioned coverage needs no second collection
#                         pass. Split from macro:state precisely so the request
#                         path reads 727 B rather than 31 KB; stripping the slice
#                         on read would hide that cost, not avoid it.
#   macrosweep:last     — PT date of the last macro sweep (dedup). Outside the
#                         `macro:` prefix so nothing scanning that prefix reads
#                         it as a record — same rule as ivsweep/movesweep.
#                         Stamped LAST, after both writes, so any failure leaves
#                         the next firing to retry.
#   mood:state          — Market Mood board: macro emotion, stance category, the
#                         one-sentence verdict + sentenceSource, breadth counts,
#                         and all 15 per-symbol reads (emotion, score, detected
#                         patterns, 1-session change, or an unavailable row with
#                         its reason). ~5.2 KB, MOOD_SCHEMA 1, strict equality.
#                         7d retained / 26h fresh (TTL.mood) — one write a
#                         trading day by the 2:00pm PT collectMarketMood, so the
#                         badge only ages once a whole cadence is missed. ONE key:
#                         the payload is small enough to read on the request path,
#                         unlike macro's state/series split.
#   moodsweep:last      — PT date of the last mood collection (dedup). Outside
#                         the `mood:` prefix, same rule as ivsweep/movesweep/
#                         macrosweep. Stamped LAST and only when all 15 symbols
#                         returned bars; a partial run still writes mood:state
#                         (a readable sector board with an unavailable verdict is
#                         a finding) but does not stamp, so the next firing
#                         retries. A run where EVERY fetch failed writes nothing.
#   13f:cursor          — which manager the 13F pass is up to (outside 13f:index)
#   econ:dgs3mo         — FRED 3-month T-bill, risk-free rate for Black-Scholes
#                         (12h fresh, 90d kept — the long retention is the outage
#                          path: no rate means no delta means no premium OR long
#                          screen, so a stale print beats a blank screen)
#   earnings:{TICKER}   — last-report earnings analysis (2d TTL)
#   market:ipos         — IPO calendar cache (12h TTL)
#   market:sectors      — sector summaries + opportunity/avoid picks (4h TTL).
#                         Also source (b) of /api/radar: its `opportunity`
#                         tickers are gate-filtered as radar candidates.
#   radar:{PT-DATE}     — one PT day's off-watchlist radar: the <=5 candidates,
#                         the per-source ok/reason verdicts, the funnel counts
#                         and the full elimination trail. 36h retention
#                         (RADAR_TTL) so a late-evening read still finds the
#                         day it names. RADAR_SCHEMA 1, strict equality. An
#                         INCOMPLETE build (a source was down) is cached but
#                         rebuilt once RADAR_RETRY_MS (10 min) has passed; a
#                         REFUSAL (watchlist:tickers unreadable) is never
#                         written at all.
#   top3:{PT-DATE}      — THE DAILY TOP-3 OPTIONS RANKING. The <=3 entries with
#                         full contract identity, every score input and EVERY
#                         component subscore (the score must be decomposable,
#                         never a bare number), the verdict rating and its as-of,
#                         the declared gates, the pool counts and gate funnel, the
#                         sweep counts and wall time, and the capped excluded[]
#                         with excludedTotal beside it. 7d retention (TOP3_TTL)
#                         so it outlives the day it names AND the weekend and
#                         holiday gaps the writer's trading-day schedule creates;
#                         date-keyed, so there is no freshness question. It was
#                         36h until 2026-08-31, which evicted every Friday record
#                         before Monday morning and left the walk-back reader
#                         below with nothing to walk back TO. TOP3_SCHEMA 1,
#                         strict equality.
#                         `entries: []` and an ABSENT key are DIFFERENT STATES:
#                         [] means the gates ran and nothing survived (a valid
#                         published result), absent means the job has not run or
#                         refused. Written by the 1:15pm PT collectTop3; read by
#                         /api/long/batch and nothing else.
#                         THE SERVING WINDOW IS THE NEWEST SURVIVING RECORD, NOT
#                         TODAY'S. readTop3 reads top3:{today} and, on a miss,
#                         walks back up to TOP3_SERVE_WALKBACK_DAYS (5) calendar
#                         days — the write happens at 1:15pm PT, so today-only
#                         reading returned null on every trading morning while a
#                         valid record sat here inside its TTL. The record is
#                         served UNMODIFIED and carries no `served` marker: its
#                         own ptDate/asOf date it. The walk is a KEY-EXISTENCE
#                         PROBE, not a validity judgment — TOP3_TTL decides what
#                         still exists, and at 7d every declared depth (0..5) is
#                         reachable: back=3 is Monday morning reading Friday's
#                         and back=5 is the Tuesday after a Fri+Mon closure
#                         reading Thursday's. Miss-path cost is capped at 5 extra
#                         KV reads; the hit path is one read, unchanged.
#   top3sweep:last      — PT date of the last COMPLETE top-3 build (dedup).
#                         Outside the `top3:` prefix, same rule as ivsweep/
#                         movesweep/macrosweep/moodsweep. Stamped LAST and only
#                         when zero tickers hit an INFRASTRUCTURE failure; a name
#                         with nothing screenable (no-options / no-iv /
#                         no-expiries) is a complete outcome and does not block it.
#                         TTL is TOP3_SWEEP_STAMP_TTL = TOP3_TTL (7d), raised
#                         from a bare 2d literal on 2026-08-31 so the stamp and
#                         the record it dedups AGE TOGETHER. The dedup itself
#                         does not care — an absent stamp merely PERMITS a run —
#                         but "stamp expired, record still here" is a third state
#                         that means nothing, and the pair is read together as a
#                         diagnostic.
#   market:week-ahead   — Friday-only week-ahead preview (18h TTL)
#   market:goldencross  — golden-cross setups (1h TTL)
#   scanner:{preset}    — day-trading scanner results (90s TTL)
#   auction:{DATE}:{SYMBOLS} — closing-auction block trades, keyed by ET date (20h TTL)
#   watchlist:tickers   — saved watchlist; also seeds scan universes
#   income:tickers      — THE INCOME SLEEVE. A SEPARATE LIST from
#                         watchlist:tickers and it must stay one: sweepUniverse()
#                         reads only the watchlist, so nothing here ever enters a
#                         cron sweep. Entries are OBJECTS on a THREE-FIELD
#                         ALLOWLIST: { ticker, addBelow, category }. addBelow is
#                         an optional user-set price; category is an enum —
#                         income | cyclical | value | defensive | null — backing
#                         the Diversify tab. Anything else is STRIPPED and named
#                         in droppedFields; a bad enum value coerces to null and
#                         is named in invalidValues. Neither ever rejects the
#                         entry, and the read normalises through the same
#                         allowlist so category round-trips. No TTL, no
#                         server-side default seeding — an absent key means the
#                         user has not built a sleeve and the endpoints say so
#                         (entries: null, never []).
#   income:prev         — previous sleeve, snapshotted before every overwrite;
#                         the one-step undo, same as watchlist:prev.
#   incomerow:{TICKER}  — one income row's SLOW half (yield + the field that
#                         carried it, payout ratio, the whole dividend-history
#                         read, the published ex-div date). 36h retained /
#                         6h fresh (INCOME_ROW_TTL / INCOME_FRESH_MS — they
#                         differ so a stale row still RENDERS, same reason as
#                         premium:). INCOME_SCHEMA 1, strict equality. The price
#                         half is NEVER cached: it comes live from one spark per
#                         20 names, because a 6h-old price would make the
#                         inAddZone event a fiction.
#                         THE PREFIX IS `incomerow:`, NOT `income:`, AND THAT IS
#                         LOAD-BEARING: `TICKERS` and `PREV` both pass
#                         REC_SYMBOL_RE, so a row key of income:{TICKER} would
#                         put the sleeve list inside the rows' own prefix and any
#                         future list({prefix:'income:'}) would read the sleeve
#                         as a ticker called TICKERS. Same rule as ivsweep:last
#                         sitting outside the iv: prefix.
#   rec:{TICKER}        — recommendation history, one entry per PT trading day
#   recfwd:last         — PT date of last forward-return fill (dedup)
#   admin:token         — bearer token gating the /api/admin/* routes
#   ratelimit:ai:global:{DAY}   — global AI request counter (25h TTL)
#   ratelimit:ai:ip:{IP}:{HOUR} — per-IP AI request counter (2h TTL)

[triggers]
# THIS EXPRESSION IS A COARSE WAKEUP AND NOTHING ELSE.
#
# It says "every 15 minutes, UTC hours 12-22, every day". It does NOT encode
# which days to run — scheduled() in worker.js decides that, in code, against
# Pacific wall-clock time, and skips weekends and NYSE holidays there.
#
# DO NOT put a day-of-week, day-of-month or month back in this expression.
# It used to end in `1-5`, which reads as Mon-Fri under standard cron.
# Cloudflare's day-of-week field is 1-indexed with 1 = Sunday, so `1-5` actually
# meant Sun-Thu: no job ever ran on a Friday, and a full Claude morning briefing
# burned every Sunday for a closed market. That went unnoticed for weeks because
# a cron that does not fire logs nothing at all. `2-6` would happen to be
# correct today and is still the wrong fix — the point is that this file cannot
# express a calendar rule you can test, and scheduled() can.
#
# The UTC hour range is still load-bearing, because a Pacific hour maps to two
# UTC hours across DST. 12-22 covers 5:00am-3:00pm PDT and 4:00am-2:00pm PST,
# so every PT job below is inside the window in both regimes:
#
# WIDENED 13-22 -> 12-22 ON 2026-09-01, for the print-vs-tape BMO first pass.
# That pass is 05:30am PT, which is 12:30 UTC under PDT and 13:30 under PST. The
# old 13-22 window covered the PST reading and NOT the PDT one, so the pass would
# have silently not run for the summer half of the year -- the 13F failure
# exactly, and the reason rule #2 requires both regimes be checked before any new
# Pacific hour is scheduled. The four extra wakeups a day (12:00/:15/:30/:45 UTC)
# are 05:00-05:45 PT under PDT and 04:00-04:45 under PST; only the 05:30 PDT one
# has a job, and the rest log `branch=none`/`branch=idle` and return.
#
# THIS IS A CHANGE TO HOW OFTEN WE WAKE UP AND TO NOTHING ELSE. No day-of-week,
# day-of-month or month goes into this expression; every date and time decision
# is still made in scheduled(), in code, where it is testable.
#   Morning briefing — 6:00am PT   (13:00 UTC PDT / 14:00 UTC PST)
#   Morning long rows— 7:00am PT   (14:00 UTC PDT / 15:00 UTC PST — inside this
#                      window in BOTH regimes, checked before scheduling per
#                      rule #2). 10:00am ET, 30 min after the open: the earliest
#                      firing that reads TODAY'S chain rather than yesterday's.
#                      Runs the SAME sequential watchlist sweep the 1:15pm top-3
#                      job runs, so every name has a fresh long:{TICKER} row for
#                      the trading morning, and banks the `open` slot of the
#                      sweep archive. IT RANKS NOTHING: no collectTop3, no
#                      top3:{PT-date}, no top3sweep:last — collectTop3's dedup is
#                      a PT-date compare, so a 7am stamp there would make the
#                      1:15pm firing skip and replace the day's official
#                      post-close ranking with one priced off opening spreads.
#                      ONE JOB ON THIS BRANCH, so its _instr IS a measurement
#                      rather than an upper bound. ~20 capCost a name all-cold,
#                      ~800 at N≈40, zero Claude calls. Own daily dedup key
#                      (morningrows:last); `m < 45` admits THREE firings — 7:00,
#                      7:15 and 7:30 — and the retry costs only the names that
#                      failed.
#                      WIDENED FROM `m < 30` ON 2026-09-02. Both firings of the
#                      old two-firing window burned on the SAME transient Yahoo
#                      crumb outage; all 40 tickers failed twice and the branch
#                      was out of retries by 07:20 with the next writer of those
#                      rows six hours away. This is a change to scheduled(), NOT
#                      to the cron expression — the expression already wakes us
#                      at :30, and rule #2 keeps every calendar decision in code.
#                      It is no longer "the same width as the 1:15pm window":
#                      that one is `m >= 15 && m < 45`, 30 minutes and two
#                      firings; this one is 45 minutes and three.
#   Midday pulse     — 11:30am PT  (18:30 UTC PDT / 19:30 UTC PST)
#   EOD summary      — 1:15pm PT   (20:15 UTC PDT / 21:15 UTC PST)
#   IV history sweep — 1:15pm PT   (runs alongside the EOD job; own daily dedup key)
#   Macro state      — 1:15pm PT   (one spark call, 4 symbols; own daily dedup key)
#   Top-3 ranking    — 1:15pm PT   (dispatched AFTER the macro bank. Sweeps the
#                      whole watchlist SEQUENTIALLY through the /api/long/:ticker
#                      computation path — one awaited Yahoo request at a time,
#                      because crumb rate-limiting is the binding constraint here,
#                      not the subrequest cap — then ranks in memory and writes
#                      top3:{PT-date}. THIS BRANCH IS NOW FOUR JOBS DEEP sharing
#                      one invocation budget, so no per-job _instr from it is a
#                      measurement. Derivation at N=40 all cold: ~20 capCost per
#                      name, ~803 total, ~8% of the ceiling. It NEVER truncates
#                      the watchlist to fit; sweep.wallMs is on the record so a
#                      shrinking margin is visible first. Own daily dedup key.)
#   Forward-ret fill — 2:00pm PT   (21:00 UTC PDT / 22:00 UTC PST; own daily dedup key)
#   Move-series sweep— 2:00pm PT   (settled daily bar; own daily dedup key)
#   Market Mood      — 2:00pm PT   (same settled bar; 15 chart fetches + 1 Claude
#                      call; own daily dedup key. Three jobs share this
#                      invocation's subrequest budget — waitUntil gets no budget
#                      of its own — so no per-job _instr from this branch is a
#                      measurement. Derivation: capCost 19.)
#   13F index slice  — 10:00am PT  (4 managers per firing, ~13 external fetches)
#                      NOT 3:00pm PT: that is 23:00 UTC under PST, outside this
#                      window, so the job never ran for half the year.
#   Print vs tape    — 05:30am + 06:15am PT (BMO names) and 1:30pm + 2:30pm PT
#                      (AMC names). FOUR passes, each a 15-minute window that
#                      admits exactly one firing. Two per session because Yahoo's
#                      ACTUALS LAG THE PRINT -- measured 2026-09-01, 42 minutes
#                      after three names reported AMC, the consensus for the
#                      reported quarter was published and the actuals were not.
#                      Pass 1 banks the consensus (which ROLLS OUT of the API
#                      once the actual lands), pass 2 catches the actual, and the
#                      record merges them field by field within one quarter.
#                      Pass 2 skips any ticker already answered.
#                      UTC in both regimes: 05:30 -> 12:30 PDT / 13:30 PST (this
#                      is why the window was widened), 06:15 -> 13:15 / 14:15,
#                      13:30 -> 20:30 / 21:30, 14:30 -> 21:30 / 22:30.
#                      Dispatched OUTSIDE the branch chain on its own clock test,
#                      because three of the four windows overlap branches the
#                      chain already owns; the pass is named in the [cron] line.
#                      capCost `ceil(N/20) + 4E + 4` -- derives to 18 at N=40
#                      with E=3 reporting; MEASURED 17 at N=6/E=3 cold crumb and
#                      5 on a firing where nobody reported. Zero Claude calls
#                      unless a name is DIVERGENT, which costs one, against the
#                      same AI_RATE_GLOBAL_DAY ceiling the request paths use.
#                      Its evidence is the printtapeday:{DATE} index, written on
#                      every pass including a zero-eligible one.
# Each job deduplicates via KV timestamp check (2-hour window).
#
# ONE EXPRESSION. A temporary every-5-minutes diagnostic probe sat here from
# 2026-08-08 to 2026-08-10 as a second `crons` entry, paired with a `PROBE_CRON`
# constant in worker.js that suppressed its dispatch. It existed because three
# post-deploy boundaries produced no [cron] line while observability logs were
# off, which made that silence uninterpretable rather than informative. It did
# its job — invocations confirmed, the weekend gate observed firing, and the
# Monday 2026-08-10 6:00am run it was watching came through clean — and both
# halves were removed together on 2026-08-10.
#
# If a probe is ever needed again: add the trigger AND the suppression constant
# in the SAME commit, and remove them the same way. A trigger without its
# suppression dispatches every real job three times inside each window, which
# dedup absorbs on a successful run but not on a failed morning briefing — that
# retries by design, and the probe would turn 2 attempts into 6 (~150 Claude
# calls instead of ~50).
crons = ["*/15 12-22 * * *"]

# Required secrets (set via: npx wrangler secret put <NAME>):
#   AI_GATE_SECRET     — REQUIRED. Shared secret gating every AI-spend and KV-write
#                        endpoint. Fails CLOSED: unset means those routes 503.
#                        Must match DASH_KEY in index.html and dashboard.html.
#   ANTHROPIC_API_KEY  — Anthropic API key
#   ALPACA_KEY         — Alpaca API key ID (optional, improves price + news quality)
#   ALPACA_SECRET      — Alpaca API secret key
#   FRED_API_KEY       — FRED (statistical release dates; without it the calendar is FOMC-only)
#   FINRA_CLIENT_ID    — FINRA OAuth2 client id (short interest; falls back to a labelled Yahoo estimate)
#   FINRA_CLIENT_SECRET— FINRA OAuth2 client secret
# SEC EDGAR needs no key, but SEC_UA in worker.js must carry a real contact email.
