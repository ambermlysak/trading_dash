name = "stock-research-worker"
main = "worker.js"
compatibility_date = "2024-09-01"

# ── Observability ────────────────────────────────────────────────────────────
# Mirrors what was set in the Cloudflare dashboard. It has to live here, because
# `wrangler deploy` sends the whole config and OVERWRITES dashboard-set values —
# the same drift that produced the cron-trigger divergence warning. Wrangler
# knows this: normalizeRemoteConfigAsResolvedLocal() in its own source skips
# observability when comparing local to remote, commenting that it "has a remote
# default behavior different from that of wrangler". So a dashboard-only setting
# survives exactly until the next deploy.
#
# WITHOUT THIS BLOCK THERE IS NO CRON EXECUTION HISTORY. `wrangler tail` streams
# live events only; with logs off, a quiet tail means nothing at all — it cannot
# distinguish "the cron did not fire" from "the cron fired and nothing was
# retained". That ambiguity cost two hours of the day this was found.
#
# The top-level `enabled` is load-bearing and is NOT redundant with logs.enabled.
# wrangler's normalizeObservability() computes
#   const enabled = obs?.enabled === true ? true : false
# and uses THAT as the default for logs.enabled. Omitting it here would deploy
# `observability.enabled: false` next to `logs.enabled: true`.
#
# Key names verified against node_modules/wrangler/config-schema.json for the
# pinned wrangler (4.118.0) rather than hand-translated from the docs — the
# published TOML example omits the nested logs/traces tables entirely.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true          # keep the per-invocation summary lines
persist = true                  # retain in the dashboard's queryable log store

# Explicitly off rather than omitted: an absent value is whatever the dashboard
# last said, which is the drift this block exists to close.
[observability.traces]
enabled = false

[[kv_namespaces]]
binding = "REC_LOG"
id = "6e2feae8a08c4db0b564e5bce18d2b01"

# KV keys used:
#   yahoo:crumb         — Yahoo session crumb (50-min TTL)
#   daily:snapshot      — 6am Claude synthesis (headline, newsCards, opportunity, avoid)
#   daily:midday        — 11:30am PT midday pulse (narrative, topics, tomorrow, trades, bigMovers)
#   daily:eod           — 1:15pm PT end-of-day summary (headline, body)
#   analysis:{TICKER}   — per-ticker Claude analysis (trend, pattern, action, summary)
#   iv:{TICKER}:{DATE}  — daily ATM IV sample feeding ivRank (400d TTL, value + KV metadata)
#   cik:map             — SEC ticker->CIK map (30d TTL)
#   insider:{TICKER}    — parsed SEC Form 4 report (12h TTL)
#   short:{TICKER}      — FINRA short interest (6h TTL)
#   13f:index           — ticker->managers 13F reverse index (rebuilt weekly)
#   finra:token         — FINRA OAuth2 bearer token
#   econ:fred           — FRED release dates (12h TTL)
#   ivsweep:last        — PT date of last cron IV sweep (dedup)
#   fund:{TICKER}       — per-ticker Yahoo fundamentals cache (6h TTL)
#   premium:{TICKER}    — premium-screen row, cached on demand (4h fresh, 24h retained)
#   long:{TICKER}       — long-screen row, cached on demand (4h fresh, 24h retained)
#   moves:{TICKER}      — historical N-session return distribution behind the Long
#                         tab's measured `cov` column and its expectancy ranking.
#                         Banked by the 2:00pm PT sweep, 7d TTL, ~60 KB/ticker.
#                         Sorted [return, startIdx] PAIRS — schema 2; the reader
#                         treats any other schema as ABSENT and recomputes.
#   calib:pooled        — pooled recommendation calibration across every rec: key.
#                         The basis used when a ticker has fewer than
#                         REC_CALIB_MIN_N resolved outcomes of its own. No TTL;
#                         rewritten daily by fillForwardReturns(), which already
#                         performs the rec: scan it needs.
#   movesweep:last      — PT date of the last move-series sweep (dedup). Outside
#                         the `moves:` prefix so nothing scanning that prefix
#                         picks it up as a ticker.
#   13f:cursor          — which manager the 13F pass is up to (outside 13f:index)
#   econ:dgs3mo         — FRED 3-month T-bill, risk-free rate for Black-Scholes
#                         (12h fresh, 90d kept — the long retention is the outage
#                          path: no rate means no delta means no premium OR long
#                          screen, so a stale print beats a blank screen)
#   earnings:{TICKER}   — last-report earnings analysis (2d TTL)
#   market:ipos         — IPO calendar cache (12h TTL)
#   market:sectors      — sector summaries + opportunity/avoid picks (4h TTL)
#   market:week-ahead   — Friday-only week-ahead preview (18h TTL)
#   market:goldencross  — golden-cross setups (1h TTL)
#   scanner:{preset}    — day-trading scanner results (90s TTL)
#   auction:{DATE}:{SYMBOLS} — closing-auction block trades, keyed by ET date (20h TTL)
#   watchlist:tickers   — saved watchlist; also seeds scan universes
#   rec:{TICKER}        — recommendation history, one entry per PT trading day
#   recfwd:last         — PT date of last forward-return fill (dedup)
#   admin:token         — bearer token gating the /api/admin/* routes
#   ratelimit:ai:global:{DAY}   — global AI request counter (25h TTL)
#   ratelimit:ai:ip:{IP}:{HOUR} — per-IP AI request counter (2h TTL)

[triggers]
# THIS EXPRESSION IS A COARSE WAKEUP AND NOTHING ELSE.
#
# It says "every 15 minutes, UTC hours 13-22, every day". It does NOT encode
# which days to run — scheduled() in worker.js decides that, in code, against
# Pacific wall-clock time, and skips weekends and NYSE holidays there.
#
# DO NOT put a day-of-week, day-of-month or month back in this expression.
# It used to end in `1-5`, which reads as Mon-Fri under standard cron.
# Cloudflare's day-of-week field is 1-indexed with 1 = Sunday, so `1-5` actually
# meant Sun-Thu: no job ever ran on a Friday, and a full Claude morning briefing
# burned every Sunday for a closed market. That went unnoticed for weeks because
# a cron that does not fire logs nothing at all. `2-6` would happen to be
# correct today and is still the wrong fix — the point is that this file cannot
# express a calendar rule you can test, and scheduled() can.
#
# The UTC hour range is still load-bearing, because a Pacific hour maps to two
# UTC hours across DST. 13-22 covers 6:00am-3:00pm PDT and 5:00am-2:00pm PST,
# so every PT job below is inside the window in both regimes:
#   Morning briefing — 6:00am PT   (13:00 UTC PDT / 14:00 UTC PST)
#   Midday pulse     — 11:30am PT  (18:30 UTC PDT / 19:30 UTC PST)
#   EOD summary      — 1:15pm PT   (20:15 UTC PDT / 21:15 UTC PST)
#   IV history sweep — 1:15pm PT   (runs alongside the EOD job; own daily dedup key)
#   Forward-ret fill — 2:00pm PT   (21:00 UTC PDT / 22:00 UTC PST; own daily dedup key)
#   13F index slice  — 10:00am PT  (4 managers per firing, ~13 external fetches)
#                      NOT 3:00pm PT: that is 23:00 UTC under PST, outside this
#                      window, so the job never ran for half the year.
# Each job deduplicates via KV timestamp check (2-hour window).
#
# ── TEMPORARY DIAGNOSTIC PROBE — REMOVE MONDAY 2026-08-10 ────────────────────
# TODO(2026-08-10): delete the second entry below AND the matching `PROBE_CRON`
# constant in worker.js. They are a pair; removing one without the other is
# exactly the drift this file keeps getting caught by.
#
# Why it exists: three consecutive post-deploy boundaries (13:00/13:15/13:30 PT)
# produced no [cron] line — but observability logs were off at the time, so that
# silence is uninterpretable, not evidence. The probe fires every 5 minutes with
# no hour restriction so evidence accumulates across the weekend rather than
# waiting for Monday 6am, and it exercises the weekend gate path (Sat/Sun must
# log "not a trading day (weekend) · branch=none", no dispatch, no KV writes).
# Both triggers are separable in the log: scheduled() prints controller.cron.
#
# IT DOES NOT DISPATCH. scheduled() matches PROBE_CRON right after the
# trading-day gate and returns, so the probe only ever proves that invocations
# happen. Left dispatching, it would triple the firings inside every dispatch
# window on a trading day; dedup absorbs that on a successful run, but a failed
# morning briefing retries by design and the probe would turn 2 attempts into 6
# (~150 Claude calls instead of ~50) — on the exact Monday 6:00am run that is
# the first real observation of the day-of-week fix.
crons = ["*/15 13-22 * * *", "*/5 * * * *"]

# Required secrets (set via: npx wrangler secret put <NAME>):
#   AI_GATE_SECRET     — REQUIRED. Shared secret gating every AI-spend and KV-write
#                        endpoint. Fails CLOSED: unset means those routes 503.
#                        Must match DASH_KEY in index.html and dashboard.html.
#   ANTHROPIC_API_KEY  — Anthropic API key
#   ALPACA_KEY         — Alpaca API key ID (optional, improves price + news quality)
#   ALPACA_SECRET      — Alpaca API secret key
#   FRED_API_KEY       — FRED (statistical release dates; without it the calendar is FOMC-only)
#   FINRA_CLIENT_ID    — FINRA OAuth2 client id (short interest; falls back to a labelled Yahoo estimate)
#   FINRA_CLIENT_SECRET— FINRA OAuth2 client secret
# SEC EDGAR needs no key, but SEC_UA in worker.js must carry a real contact email.
